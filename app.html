<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>willist ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root { color-scheme: light; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* LIFESTAR 共通スタイル。
   配色: 灰緑がかった紙 / 墨色 / 藍(ブランド1) / 蛍光ペンの黄色(ブランド2・印をつける所だけ)
   書体: 見出し=Zen Kaku Gothic New、本文=BIZ UDPGothic、数字や日付=IBM Plex Mono */
:root {
  --paper: #EEF0EC;
  --paper-2: #E2E7E1;
  --ink: #1B2A34;
  --ink-soft: #56656D;
  --rule: #C3CCC6;
  --indigo: #1F4E79;
  --on-indigo: #F4F6F1;
  --marker: rgba(240, 207, 74, 0.85);
  --font-head: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gutter: clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10171C; --paper-2: #172229; --ink: #E7ECE8; --ink-soft: #96A5AD; --rule: #2B3A43;
    --indigo: #86B4DE; --on-indigo: #0F1A22; --marker: rgba(214, 176, 48, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10171C; --paper-2: #172229; --ink: #E7ECE8; --ink-soft: #96A5AD; --rule: #2B3A43;
  --indigo: #86B4DE; --on-indigo: #0F1A22; --marker: rgba(214, 176, 48, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-head); font-weight: 700; line-height: 1.5; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: var(--gutter); }
.mono { font-family: var(--font-mono); letter-spacing: 0.04em; }
.soft { color: var(--ink-soft); }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }

/* 蛍光ペンで印をつけた箇所 */
.hl { box-shadow: inset 0 -0.42em 0 var(--marker); -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* ブランドマーク(朱ではなく藍の判子) */
.mark { display: block; width: 34px; height: 34px; object-fit: contain; flex: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mark { background: #EEF0EC; border-radius: 3px; padding: 2px; } }
:root[data-theme="dark"] .mark { background: #EEF0EC; border-radius: 3px; padding: 2px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-family: var(--font-head); font-weight: 700; letter-spacing: 0.1em; font-size: 17px; }

/* ボタン */
.btn {
  display: inline-block; padding: 0.8em 1.5em; background: var(--indigo); color: var(--on-indigo); border: 2px solid var(--indigo);
  border-radius: 2px; font-family: var(--font-head); font-weight: 700; font-size: 15px; line-height: 1.4; text-decoration: none; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.small { padding: 0.5em 1em; font-size: 14px; }
.textlink { font-family: var(--font-head); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; background: none; border: 0; padding: 0; color: var(--indigo); cursor: pointer; }

/* 書き出し見本(縦横比は実際の画像と同じ。文字はコンテナ幅に比例) */
.sample { container-type: inline-size; position: relative; overflow: hidden; border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 10px 24px -12px rgba(16, 30, 40, .35); }
.sample.post { aspect-ratio: 1080 / 1350; }
.sample.story { aspect-ratio: 1080 / 1920; }
.sample.t-note { background: #EEF0EC; color: #1B2A34; --s-sub: #56656D; --s-rule: #C3CCC6; --s-acc: #1F4E79; }
.sample.t-sumi { background: #1B2A34; color: #EEF0EC; --s-sub: #9FB0B8; --s-rule: #33454F; --s-acc: #F0CF4A; }
.sample.t-sakura { background: #F7E9EB; color: #35262B; --s-sub: #85676F; --s-rule: #E6CBD1; --s-acc: #B13F5C; }
.sample.t-aoi { background: #E8E7F2; color: #23223A; --s-sub: #6C6A8C; --s-rule: #CBC9E0; --s-acc: #52489C; }
.sample.t-kuchinashi { background: #F8EBC1; color: #352A12; --s-sub: #7A6638; --s-rule: #E5D295; --s-acc: #A15F08; }
.sample.t-ai { background: #1F4E79; color: #F4F6F1; --s-sub: #B9CCDF; --s-rule: #3F6F9A; --s-acc: #F0CF4A; }
.sample .in { position: absolute; inset: 0; padding: 8.5cqw 8.5cqw 7cqw; display: flex; flex-direction: column; }
.sample.story .in { padding-block: 23cqw 23cqw; }
.sample .head { display: flex; align-items: flex-start; gap: 3.4cqw; }
.sample .stamp { width: 9cqw; height: 9cqw; margin-top: -0.85cqw; padding: 0.5cqw; background: #EEF0EC; border-radius: 0.5cqw; object-fit: contain; flex: none; display: block; }
.sample .ttl { font-family: var(--font-head); font-weight: 700; font-size: 5.6cqw; line-height: 1.3; }
.sample .dt { font-family: var(--font-mono); font-size: 2.5cqw; color: var(--s-sub); letter-spacing: .06em; }
.sample ol { list-style: none; margin: 5cqw 0 0; padding: 0; flex: 1; }
.sample li { display: flex; gap: 3.4cqw; align-items: baseline; padding: 1.55cqw 0; border-bottom: 0.25cqw solid var(--s-rule); font-size: 4cqw; line-height: 1.4; }
.sample li .n { font-family: var(--font-mono); font-size: 2.8cqw; color: var(--s-acc); width: 5cqw; flex: none; }
.sample .q { font-family: var(--font-head); font-weight: 700; font-size: 6.4cqw; line-height: 1.65; margin-top: 5cqw; flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding-bottom: 21.2cqw; }
.sample .lbl { font-family: var(--font-mono); font-size: 2.7cqw; letter-spacing: .14em; color: var(--s-acc); }
.sample .bar { width: 12cqw; height: 1cqw; background: var(--s-acc); margin-top: 3cqw; }
.sample .vals { list-style: none; margin: 6cqw 0 0; padding: 0; flex: 1; }
.sample .vals li { display: block; padding: 2.6cqw 0; font-size: 3.2cqw; color: var(--s-sub); }
.sample .vals b { display: block; font-family: var(--font-head); font-size: 6cqw; color: inherit; line-height: 1.3; }
.sample .vals li { color: var(--s-sub); }
.sample .vals b { color: var(--ink); }
.sample.t-sumi .vals b, .sample.t-ai .vals b { color: inherit; }
.sample.t-note .vals b { color: #1B2A34; }
.sample .foot { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 2.5cqw; letter-spacing: .08em; color: var(--s-sub); padding-top: 3cqw; }

/* 判子(達成) */
.stamp-done {
  display: inline-block; border: 2px solid var(--indigo); color: var(--indigo); padding: 1px 9px; border-radius: 3px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; line-height: 1.7; transform: rotate(-4deg); white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* 価値観の例(アプリ画面) */
.exg { margin-top: 26px; }
.exg h3 { font-size: 13px; letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 4px; }
.exlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; border-top: 1px solid var(--rule); }
.ex { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px 0 11px; cursor: pointer; font: inherit; color: var(--ink); display: block; width: 100%; }
.ex b { font-family: var(--font-head); font-size: 16px; }
.ex i { font-size: 11px; color: var(--indigo); font-style: normal; margin-left: 6px; }
.ex span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
.ex:hover:not(:disabled) b { box-shadow: inset 0 -0.4em 0 var(--marker); }
.ex:disabled { cursor: default; opacity: .6; }
@media (max-width: 640px) { .exlist { grid-template-columns: minmax(0, 1fr); } }

/* カードで選ぶ */
.themes { border-top: 1px solid var(--rule); }
.themes button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 0; font: inherit; font-family: var(--font-head); font-weight: 700; color: var(--ink); cursor: pointer; }
.themes button:hover { box-shadow: inset 0 -0.5em 0 var(--marker); }
.deckrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.vcard { position: relative; text-align: left; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px; padding: 14px 14px 16px; min-height: 104px; cursor: pointer; font: inherit; color: var(--ink); display: block; }
.vcard b { display: block; font-family: var(--font-head); font-size: 20px; line-height: 1.4; }
.vcard span { display: block; margin-top: 4px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
.vcard:hover { background: var(--paper-2); }
.vcard.drawn { border-color: var(--indigo); box-shadow: 4px 4px 0 var(--indigo); padding-top: 26px; }
.vcard .tag { position: absolute; top: 7px; left: 14px; font-size: 10px; font-style: normal; color: var(--indigo); letter-spacing: .06em; }
@media (max-width: 640px) { .deckrow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* バケットリストの例 */
.bex { margin: 0; padding: 0 0 0 1.2em; list-style: disc; columns: 2; column-gap: 32px; }
.bex li { break-inside: avoid; padding: 3px 0; }
.bex li::marker { color: var(--indigo); }
.bex button { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.bex button:hover:not(:disabled) { box-shadow: inset 0 -0.4em 0 var(--marker); }
.bex button:disabled { opacity: .55; cursor: default; }
.bex i { font-size: 11px; color: var(--indigo); font-style: normal; margin-left: 6px; }
@media (max-width: 640px) { .bex { columns: 1; } }

.bex.one { columns: 1; }

/* ありたい姿: 改行プレビュー */
.vprev { border-left: 3px solid var(--indigo); padding: 4px 0 4px 16px; font-family: var(--font-head); font-weight: 700; font-size: 17px; line-height: 1.9; overflow-wrap: anywhere; }
.vprev .gap { height: 0.9em; }
.vprev .nl { font-style: normal; font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--indigo); margin-left: 6px; opacity: .8; }


/* ---- アプリ ---- */
.app { max-width: 760px; margin-inline: auto; padding-inline: var(--gutter); padding-block: 0 96px; }
.bar { display: flex; justify-content: space-between; align-items: center; padding-block: 18px; gap: 12px; }
.bar .who { font-size: 12px; color: var(--ink-soft); }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 10px 0 11px; font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--indigo); }
.view { padding-top: 32px; }
.view h1 { font-size: 26px; }
.view .intro { margin-top: 6px; font-size: 14px; color: var(--ink-soft); }
.sec { margin-top: 36px; }
.sec > h2 { font-size: 13px; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; }
.notice { margin-top: 24px; padding: 12px 14px; border-left: 3px solid var(--indigo); background: var(--paper-2); font-size: 14px; display: flex; gap: 14px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

/* ホーム */
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .num { font-family: var(--font-head); font-weight: 700; font-size: 56px; line-height: 1.1; color: var(--indigo); font-variant-numeric: tabular-nums; }
.big .of { color: var(--ink-soft); }
.meter { margin-top: 10px; height: 4px; background: var(--rule); }
.meter i { display: block; height: 100%; background: var(--indigo); }
.quote { margin: 0; padding: 2px 0 2px 18px; border-left: 3px solid var(--ink); font-family: var(--font-head); font-weight: 500; font-size: 19px; line-height: 1.9; }
.quote.empty { color: var(--ink-soft); font-weight: 400; font-size: 15px; border-left-color: var(--rule); }
.vals-inline { font-family: var(--font-head); font-weight: 700; font-size: 18px; }
.vals-inline span + span::before { content: "・"; color: var(--ink-soft); padding-inline: 4px; font-weight: 400; }

/* リスト */
.filters { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 20px; font-size: 14px; }
.filters button { background: none; border: 0; padding: 4px 0; font: inherit; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--marker); box-shadow: inset 0 -0.4em 0 var(--marker); border-bottom: 0; }
.list { margin: 14px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
.item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.check { width: 22px; height: 22px; margin-top: 3px; border: 1.5px solid var(--ink); border-radius: 2px; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: var(--on-indigo); }
.check[aria-checked="true"] { background: var(--indigo); border-color: var(--indigo); }
.check svg { width: 14px; height: 14px; display: none; }
.check[aria-checked="true"] svg { display: block; }
.item .t { font-weight: 700; font-size: 16px; line-height: 1.6; word-break: break-word; }
.item.done .t { color: var(--ink-soft); font-weight: 400; }
.item .m { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.item .side { display: flex; gap: 12px; align-items: center; padding-top: 2px; }
.mini { background: none; border: 0; padding: 2px 0; font-size: 12px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-family: var(--font-body); }
.mini.warn { color: #B3361F; }
:root[data-theme="dark"] .mini.warn { color: #F29A87; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mini.warn { color: #F29A87; } }
.editrow { display: grid; gap: 8px; grid-column: 2 / -1; }
.empty-note { padding: 28px 0; color: var(--ink-soft); }

.form { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 96px 88px auto; gap: 10px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-soft); }
input[type="text"], input[type="number"], select, textarea.plain {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--ink-soft); border-radius: 2px; padding: 9px 10px; min-width: 0;
}
select { appearance: auto; }

/* 罫線入りのノート */
.paper { display: block; width: 100%; min-height: 252px; font-family: var(--font-body); font-size: 17px; line-height: 36px; color: var(--ink);
  background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px);
  border: 0; border-left: 3px solid var(--indigo); padding: 0 14px; resize: vertical; border-radius: 0; }
.savedmsg { font-size: 12px; color: var(--ink-soft); margin-top: 8px; min-height: 1.6em; }
.hints { margin: 6px 0 0; padding-left: 1.2em; color: var(--ink-soft); font-size: 14px; }

/* 価値観 */
.vlist { margin: 18px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
.vrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.vrow .no { font-family: var(--font-mono); color: var(--ink-soft); padding-top: 6px; font-size: 13px; }
.vrow:first-child .no { color: var(--indigo); }
.vrow input.name { font-family: var(--font-head); font-weight: 700; font-size: 22px; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 2px 0; width: 100%; color: var(--ink); }
.vrow input.desc { font-size: 15px; border: 0; border-bottom: 1px solid transparent; background: transparent; padding: 2px 0; width: 100%; color: var(--ink-soft); font-family: var(--font-body); }
.vrow input:hover, .vrow input:focus { border-bottom-color: var(--rule); }
.vrow:first-child input.name { font-size: 26px; }
.vside { display: flex; gap: 12px; padding-top: 8px; }

/* 書き出し */
.opts { margin: 8px 0 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; }
.opts label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; }
.opts input { accent-color: var(--indigo); width: 17px; height: 17px; margin: 0; }
.export { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 40px; align-items: start; }
.preview img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); background: var(--paper-2); }
.preview .cap { font-size: 12px; margin-top: 8px; color: var(--ink-soft); }
.captionbox { width: 100%; min-height: 120px; font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 10px; }

.botnav { display: none; }
@media (max-width: 640px) {
  .app { padding-bottom: 120px; }
  .tabs.top { display: none; }
  .botnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--paper); border-top: 1px solid var(--rule); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .botnav .tab { font-size: 12px; padding: 8px 4px; border-bottom: 0; border-top: 3px solid transparent; margin: 0; flex: 1; text-align: center; }
  .botnav .tab[aria-current="page"] { border-top-color: var(--indigo); }
  .form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .form .field.title { grid-column: 1 / -1; }
  .form .go { grid-column: 1 / -1; }
  .export { grid-template-columns: minmax(0, 1fr); }
  .preview { max-width: 320px; }
  .big .num { font-size: 48px; }
}
</style>
</head>
<body>

    if (act === "del") { if (ui.confirm === id) { state.items = state.items.filter(function (i) { return i.id !== id; }); ui.confirm = null; save(); } else ui.confirm = id; return render(); }
    if (act === "cat") { ui.cat = t.dataset.cat; return render(); }
    if (act === "up" && idx > 0) { var a = state.values; var x = a[idx]; a[idx] = a[idx - 1]; a[idx - 1] = x; save(); return render(); }
    if (act === "down" && idx < state.values.length - 1) { var b = state.values; var y = b[idx]; b[idx] = b[idx + 1]; b[idx + 1] = y; save(); return render(); }
    if (act === "cstart") { dealCards(""); return keepRender(); }
    if (act === "cdiscard") { discardCard(Number(t.dataset.i)); return keepRender(); }
    if (act === "cfinish") { if (ui.cards) ui.cards.phase = "result"; return keepRender(); }
    if (act === "cquit") { ui.cards = null; return keepRender(); }
    if (act === "capply") { if (ui.cards && ui.cards.hand) { state.values = ui.cards.hand.map(function (cd) { return { name: cd.name, desc: cd.desc }; }); save(); } ui.cards = null; return keepRender(); }
    if (act === "addbex") {
      var bt = BUCKET_EX[t.dataset.c][Number(t.dataset.k)];
      if (!state.items.some(function (i) { return i.title === bt; })) { state.items.push({ id: state.nextId++, title: bt, cat: t.dataset.c, year: now.getFullYear() + 1, done: false, doneDate: "" }); save(); }
      var keepB = window.scrollY; render(); window.scrollTo(0, keepB); return;
    }
    if (act === "addvex") {
      var vt = VISION_EX[Number(t.dataset.g)][1][Number(t.dataset.k)], cv = (state.vision.main || "").trim();
      state.vision.main = cv ? cv + "\n\n" + vt : vt; save();
      var keepV = window.scrollY; render(); window.scrollTo(0, keepV); return;
    }
    if (act === "addex") {
      var ex = EXAMPLES[Number(t.dataset.g)][1][Number(t.dataset.k)];
      if (state.values.length < MAX_VALUES && !state.values.some(function (v) { return v.name === ex[0]; })) { state.values.push({ name: ex[0], desc: ex[1] }); save(); }
      var keepY = window.scrollY; render(); window.scrollTo(0, keepY); return;
    }
    if (act === "vdel") { state.values.splice(idx, 1); save(); return render(); }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "addForm") {
      var title = $("#a-title").value.trim(); if (!title) return;
      state.items.push({ id: state.nextId++, title: title, cat: "その他", year: now.getFullYear() + 1, done: false, doneDate: "" });
      save(); render(); var f = $("#a-title"); if (f) f.focus();
    }
    if (e.target.id === "vForm") {
      var n = $("#v-name").value.trim(); if (!n || state.values.length >= MAX_VALUES) return;
      state.values.push({ name: n, desc: $("#v-desc").value.trim() }); save(); render(); var g = $("#v-name"); if (g) g.focus();
    }
  });

  var vTimer = 0;
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "vtext") {
      state.vision.main = t.value; save(); clearTimeout(vTimer);
      var vp = $("#vprev"); if (vp) vp.innerHTML = vprevHTML(t.value);
      var m = $("#vmsg"); if (m) m.textContent = "書き込み中";
      vTimer = setTimeout(function () { var mm = $("#vmsg"); if (mm) mm.textContent = "保存しました  " + pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()); }, 500);
    }
    if (t.matches && t.matches(".vrow input")) { var row = t.closest(".vrow"); state.values[Number(row.dataset.i)][t.dataset.f] = t.value; save(); }
    if (t.id === "handle") { state.handle = t.value.trim(); save(); var hh = $("#hello"); if (hh) hh.innerHTML = helloText(); if ($("#pimg")) refreshPreview(); }
    if (t.id === "caption") { ui.exp.caption = t.value; }
  });
  document.addEventListener("change", function (e) {
    var t = e.target; if (t.type !== "radio") return;
    var o = ui.exp;
    if (t.name === "kind") o.kind = t.value; if (t.name === "tpl") o.tpl = t.value; if (t.name === "size") o.size = t.value;
    o.caption = null;
    var pos = window.scrollY; render(); window.scrollTo(0, pos);
  });
  document.addEventListener("click", function (e) {
    if (e.target.id !== "copyCap") return;
    var ta = $("#caption"), msg = $("#cmsg");
    function fallback() { ta.focus(); ta.select(); if (msg) msg.textContent = "選択しました。コピーしてください"; }
    try { navigator.clipboard.writeText(ta.value).then(function () { if (msg) msg.textContent = "コピーしました"; }, fallback); } catch (err) { fallback(); }
  });

  render();
})();
</script>
</body>
</html>
